apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: "{{ .Values.global.imageRegistry }}/api:{{ .Values.global.imageTag }}"
        command: ["./bin/docker-entrypoint-api.sh"]
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: plane-vault-secret
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
