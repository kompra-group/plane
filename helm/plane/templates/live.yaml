apiVersion: apps/v1
kind: Deployment
metadata:
  name: live
spec:
  replicas: 1
  selector:
    matchLabels:
      app: live
  template:
    metadata:
      labels:
        app: live
    spec:
      containers:
      - name: live
        image: "{{ .Values.global.imageRegistry }}/live:{{ .Values.global.imageTag }}"
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: plane-vault-secret
---
apiVersion: v1
kind: Service
metadata:
  name: live
spec:
  selector:
    app: live
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
