apiVersion: apps/v1
kind: Deployment
metadata:
  name: space
spec:
  replicas: 1
  selector:
    matchLabels:
      app: space
  template:
    metadata:
      labels:
        app: space
    spec:
      containers:
      - name: space
        image: "{{ .Values.global.imageRegistry }}/space:{{ .Values.global.imageTag }}"
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: plane-vault-secret
---
apiVersion: v1
kind: Service
metadata:
  name: space
spec:
  selector:
    app: space
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
