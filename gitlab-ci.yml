#stages:
#  - build
#  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

build_components:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY_PUSH -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - IMAGE_TAG=$CI_REGISTRY_PUSH/plane/$COMPONENT:$CI_COMMIT_SHORT_SHA
    - docker build --build-arg DOCKER_BUILDKIT=1 -t $IMAGE_TAG -f $DOCKERFILE $BUILD_CONTEXT
    - docker push $IMAGE_TAG
  parallel:
    matrix:
      - COMPONENT: web
        DOCKERFILE: apps/web/Dockerfile.web
        BUILD_CONTEXT: .
      - COMPONENT: admin
        DOCKERFILE: apps/admin/Dockerfile.admin
        BUILD_CONTEXT: .
      - COMPONENT: space
        DOCKERFILE: apps/space/Dockerfile.space
        BUILD_CONTEXT: .
      - COMPONENT: api
        DOCKERFILE: apps/api/Dockerfile.api
        BUILD_CONTEXT: ./apps/api
      - COMPONENT: worker
        DOCKERFILE: apps/api/Dockerfile.api
        BUILD_CONTEXT: ./apps/api
      - COMPONENT: beat-worker
        DOCKERFILE: apps/api/Dockerfile.api
        BUILD_CONTEXT: ./apps/api
      - COMPONENT: migrator
        DOCKERFILE: apps/api/Dockerfile.api
        BUILD_CONTEXT: ./apps/api
      - COMPONENT: live
        DOCKERFILE: apps/live/Dockerfile.live
        BUILD_CONTEXT: .
      - COMPONENT: proxy
        DOCKERFILE: apps/proxy/Dockerfile.ce
        BUILD_CONTEXT: ./apps/proxy
  tags:
    - k8s

deploy_to_k8s:
  stage: deploy
  image: dtzar/helm-kubectl:3.12.0
  before_script:
  - mkdir -p ~/.kube
  - cp "$KUBE_CONFIG" ~/.kube/config
  - chmod 600 ~/.kube/config
  script:
    - helm upgrade --install plane ./helm/plane --namespace plane --set global.imageTag=$CI_COMMIT_SHORT_SHA
  only:
    - dev
  tags:
    - k8s    
